name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/husseinmoukalled/portfolio_jenkins:latest .

      - name: Push Docker image
        run: docker push ghcr.io/husseinmoukalled/portfolio_jenkins:latest
  deploy:
    needs: test
    runs-on: [self-hosted, portfolio-deploy]
    steps:
      - name: Check Docker on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Check Docker on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker info
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 ghcr.io/husseinmoukalled/portfolio_jenkins:latest

      - name: Pull image on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker pull --platform linux/amd64 ghcr.io/husseinmoukalled/portfolio_jenkins:latest

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $existing = docker ps -aq --filter "name=^/portfolio-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($existing) {
            docker rm -f portfolio-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 ghcr.io/husseinmoukalled/portfolio_jenkins:latest
          exit $LASTEXITCODE

      - name: Deploy on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          existing=$(docker ps -aq --filter "name=^/portfolio-app$")
          if [ -n "$existing" ]; then
            docker rm -f portfolio-app
          fi

          docker run -d --platform linux/amd64 --name portfolio-app -p 127.0.0.1:8000:8000 ghcr.io/husseinmoukalled/portfolio_jenkins:latest